      display: grid;

      gap: 25px;
      margin-bottom: 50px;
    }
    
    .bento-card {
      background: var(--card-bg);

      flex-direction: column;

    }
    
    .bento-card:hover {
      border-color: rgba(255, 122, 0, 0.18);
      transform: translateY(-5px);
    }
    
    .card-image-wrapper {
      width: 100%;
      height: 200px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 22px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    
    .card-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    .bento-card:hover .card-image-wrapper img {
      transform: scale(1.08);
    }
    
    /* Non-symmetric Layout rules */
    .card-large {
      grid-column: span 7;
      grid-row: span 1;
    }
    
    .card-small {
      grid-column: span 5;
      grid-row: span 1;
    }
    
    .card-full {
      grid-column: span 12;
      grid-row: span 1;
      text-align: left;
      align-items: flex-start;
      background: linear-gradient(180deg, rgba(28, 25, 23, 0.75) 0%, rgba(12, 10, 9, 0.9) 100%);

      padding: 4px;
      gap: 12px;

    }

        btnText: '不點餐，直接感應綁定 LINE 會員集點',
        successSub: '阿寶阿姨已為您處理！正在引導至滿意度調查，完成即可領取「中冰奶免費升級大杯券」！',
        guideText: '桌邊感應預點單：傳統早餐店無痛升級，客人免去前台擠著排隊，在座位上感應點餐。金額自動結算，客人前往櫃檯報桌號付款，阿姨即時收到單據開始做餐！',
        items: [
          { id: 'item1', tag: 'SIGNATURE GRILLED // 經典必點', title: '招牌爆漿起司蛋餅', desc: '手工特製起司蛋餅皮，煎至酥脆，起司濃意牽絲。', price: 55, img: 'assets/cheese_omelet.png', sizeClass: 'card-large' },
          { id: 'item2', tag: 'HOT SELLER // 活力推薦', title: '卡啦雞腿堡 (辣味)', desc: '酥炸金黃香辣卡啦雞腿排，搭配爽脆生菜與秘製沙拉醬。', price: 70, img: 'assets/chicken_burger.png', sizeClass: 'card-small' },
          { id: 'item3', tag: 'LEGENDARY NOODLES // 飽足首選', title: '經典黑胡椒鐵板麵', desc: '鐵板大火熱炒麵條，淋上獨門調製黑胡椒醬，附上金黃太陽蛋。', price: 65, img: 'assets/iron_noodles.png', sizeClass: 'card-small' },
          { id: 'item4', tag: 'SNACKS // 金黃小點', title: '酥炸金黃雞塊', desc: '外皮金黃酥脆，雞肉鮮嫩多汁，搭配經典番茄醬，大人小孩都愛。', price: 45, img: 'assets/chicken_nuggets.png', sizeClass: 'card-large' },
          { id: 'item5', tag: 'LEGENDARY DRINK // 早餐靈魂', title: '阿寶大杯中冰奶', desc: '網民熱議傳奇奶茶，茶香濃郁，口感滑順，早餐不可或缺的黃金拍檔。', price: 30, img: 'assets/iced_milk_tea.png', sizeClass: 'card-full' }
        ]
      }
    };
    
    // Apply Scene Configuration
    const config = sceneConfigurations[scene] || sceneConfigurations.bistro;
    
    document.getElementById('portal-tag').textContent = config.tag;
    document.getElementById('portal-title').textContent = config.title;
    document.getElementById('portal-subtitle').textContent = config.subtitle;
    document.getElementById('hijack-btn').textContent = config.btnText;
    document.getElementById('demo-guide-text').textContent = config.guideText;
    
    // Dynamic Bento Card Rendering
    const bentoContainer = document.getElementById('menu-bento');
    bentoContainer.innerHTML = '';
    
    config.items.forEach(item => {
      const card = document.createElement('div');
      card.className = `bento-card ${item.sizeClass}`;
      
      card.innerHTML = `
        <div class="card-tag">${item.tag}</div>
        <div class="card-image-wrapper">
          <img src="${item.img}" alt="${item.title}" loading="lazy">
        </div>
        <h3 class="item-title">${item.title}</h3>
        <p class="item-desc">${item.desc}</p>
        <div class="item-price-row">
          <span class="item-price">NT$ ${item.price}</span>
          <div class="quantity-selector">
            <button class="qty-btn" type="button" onclick="changeQty('${item.id}', -1)">-</button>
            <span class="qty-display" id="${item.id}-qty">0</span>
            <button class="qty-btn" type="button" onclick="changeQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `;
      bentoContainer.appendChild(card);
    });
    
    // Interactive Shopping Cart Store
    const cart = {};
    config.items.forEach(item => {
      cart[item.id] = 0;
    });
    
    function changeQty(itemId, delta) {
      cart[itemId] = Math.max(0, cart[itemId] + delta);
      document.getElementById(itemId + '-qty').textContent = cart[itemId];
      updateCartDisplay();
    }
    
    function updateCartDisplay() {
      const prices = {};
      const names = {};
      config.items.forEach(item => {
        prices[item.id] = item.price;
        names[item.id] = item.title;
      });
      
      let totalQty = 0;
      let totalPrice = 0;
      const selectedItems = [];
      
      for (const id in cart) {
        if (cart[id] > 0) {
          totalQty += cart[id];
          totalPrice += cart[id] * prices[id];
          selectedItems.push({
            id: id,
            name: names[id],
            qty: cart[id],
            price: prices[id]
          });
        }
      }
      
      const cartBar = document.getElementById('floating-cart-bar');
      const countLabel = document.getElementById('cart-count-label');
      const totalLabel = document.getElementById('cart-total-price');
      
      countLabel.textContent = `已選擇 ${totalQty} 份餐點`;
      totalLabel.textContent = `NT$ ${totalPrice}`;
      
      if (totalQty > 0) {
        cartBar.classList.add('active');
      } else {
        cartBar.classList.remove('active');
      }
      
      // Save temp cart data to local storage for submission bridge
      const cartPayload = {
        items: selectedItems,
        total: totalPrice,
        qty: totalQty
      };
      localStorage.setItem('fltl_active_cart', JSON.stringify(cartPayload));
    }
    
    // Clear old cart on start
    localStorage.removeItem('fltl_active_cart');
    
    // Action handler
    const hijackBtn = document.getElementById('hijack-btn');
    const cartSubmitBtn = document.getElementById('cart-submit-btn');
    const loaderOverlay = document.getElementById('loader-overlay');
    const loaderText = document.getElementById('loader-text');
    const loaderSubtext = document.getElementById('loader-subtext');
    
    function triggerOrderSubmission(hasOrder) {
      loaderOverlay.style.display = 'flex';
      localStorage.setItem('fltl_line_joined', 'true');
      
      setTimeout(() => {
        loaderText.textContent = hasOrder ? '訂單傳送中...' : 'LINE 好友綁定成功！';
        loaderText.style.color = 'var(--accent-orange)';
        loaderSubtext.textContent = hasOrder ? '已成功彙整預點單！正在導引至滿意度回饋與禮遇領取畫面...' : config.successSub;
        
        setTimeout(() => {
          window.location.href = `review-gate.html?scene=${scene}`;
        }, 2500);
      }, 1200);
    }
    
    hijackBtn.addEventListener('click', () => {
      // Direct join without ordering
      localStorage.removeItem('fltl_active_cart');
      triggerOrderSubmission(false);
    });
    
    cartSubmitBtn.addEventListener('click', () => {
      // Order submission
      triggerOrderSubmission(true);
    });
  </script>
</body>
</html>
