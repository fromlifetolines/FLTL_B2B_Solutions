<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活線條 // B2B 商業空間解決方案入口</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="生活線條 B2B 商業解決方案原型門戶。快速存取好評系統、商家管理後台與企業方案著陸頁。">
  <meta name="author" content="生活線條 From Life To Lines">
  
  <!-- Google Fonts: Space Grotesk & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent-color: #CCFF00;
      --bg-dark: #0D0E10;
      --text-primary: #FFFFFF;
      --text-secondary: #8E9196;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.06);
      
      --font-tech: 'Space Grotesk', sans-serif;
      --font-tc: 'Noto Sans TC', sans-serif;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(rgba(204, 255, 0, 0.008) 1px, transparent 1px),
        linear-gradient(90deg, rgba(204, 255, 0, 0.008) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center;
      font-family: var(--font-tc);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    
    /* Neon background aura */
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(204, 255, 0, 0.03) 0%, rgba(204, 255, 0, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }
    
    .portal-container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      padding: 50px 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
      z-index: 10;
      position: relative;
      animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    .header {
      margin-bottom: 40px;
    }
    
    .tag-tech {
      font-family: var(--font-tech);
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      color: var(--accent-color);
      font-weight: 700;
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(204, 255, 0, 0.2);
    }
    
    .title-main {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.3;
      margin-bottom: 15px;
    }
    
    .subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.6;
      font-weight: 300;
    }
    
    /* Navigation List */
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 25px;
    }
    
    .nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--card-border);
      padding: 18px 24px;
      border-radius: 16px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }
    
    .nav-link:hover {
      background: rgba(204, 255, 0, 0.03);
      border-color: var(--accent-color);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(204, 255, 0, 0.05);
    }
    
    .nav-link:active {
      transform: translateY(0);
    }
    
    .link-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      transition: color 0.3s;
    }
    
    .nav-link:hover .link-title {
      color: var(--accent-color);
    }
    
    .link-subtitle {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 300;
    }
    
    /* Footer */
    .footer {
      font-family: var(--font-tech);
      font-size: 0.7rem;
      color: var(--text-disabled);
      letter-spacing: 0.1em;
      margin-top: 15px;
    }
    
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    @media (max-width: 480px) {
      .portal-container {
        padding: 40px 20px;
      }
      .title-main {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- Floating background glow -->
  <div class="bg-glow"></div>
  
  <div class="portal-container">
    <header class="header">
      <div class="tag-tech">FLTL B2B SUITE //</div>
      <h1 class="title-main">數據軍火庫 Staging 總門戶</h1>
      <p class="subtitle">
        點擊下方高奢膠囊按鈕，即可直接免手打跳轉至各實機測試模組。
      </p>
    </header>
    
    <nav class="nav-list">
      <!-- review-gate.html -->
      <a href="review-gate.html" class="nav-link">
        <span class="link-title">5 星好評系統 2.0</span>
        <span class="link-subtitle">Lead Gen Review Gate // 智慧星級分流與名單捕獲</span>
      </a>
      
      <!-- b2b-admin-staging.html -->
      <a href="b2b-admin-staging.html" class="nav-link">
        <span class="link-title">B2B 數據可視化後台</span>
        <span class="link-subtitle">Admin Dashboard // 好友增長與負評防禦觀測</span>
      </a>
      
      <!-- enterprise-landing.html -->
      <a href="enterprise-landing.html" class="nav-link">
        <span class="link-title">企業方案 Landing Page</span>
        <span class="link-subtitle">Enterprise Landing Page // 實體感應入口產品介紹</span>
      </a>
    </nav>
    
    <footer class="footer">
      FROM LIFE TO LINES © 2026 // ALL RIGHTS RESERVED
    </footer>
  </div>
</body>
</html>
